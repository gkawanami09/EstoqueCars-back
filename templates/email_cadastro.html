<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirme seu cadastro</title>
</head>
<body style="font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f4f5; padding: 40px 20px; margin: 0; text-align: center;">

  <div style="max-width: 500px; margin: 0 auto; background-color: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); text-align: center;">

    <h1 style="color: #EF4444; font-size: 24px; margin-top: 0; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px;">
      Estoque Cars
    </h1>

    <hr style="border: none; border-top: 1px solid #e4e4e7; margin-bottom: 25px;">

    <h2 style="color: #18181b; font-size: 22px; margin-bottom: 10px; font-weight: 600;">
      Olá, {{ nome }}!
    </h2>

    <p style="font-size: 16px; color: #52525b; line-height: 1.6; margin-bottom: 30px;">
      Falta muito pouco para você acessar nossa plataforma. Utilize o código de verificação abaixo para ativar sua conta:
    </p>

    <div style="background-color: #fafafa; border: 2px dashed #d4d4d8; padding: 15px 20px; border-radius: 8px; margin-bottom: 30px; display: inline-block;">
      <span style="font-size: 28px; font-weight: bold; color: #EF4444; letter-spacing: 5px;">
        {{ codigo }}
      </span>
    </div>

    <p style="font-size: 14px; color: #a1a1aa; line-height: 1.5; margin: 0;">
      Se você não criou uma conta no Estoque Cars, pode ignorar este e-mail com segurança.
    </p>

  </div>

  <div style="max-width: 500px; margin: 20px auto 0; text-align: center;">
    <p style="font-size: 12px; color: #a1a1aa;">
      &copy; 2026 Estoque Cars. Todos os direitos reservados.
    </p>
  </div>

</body>
</html>
